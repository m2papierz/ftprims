[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qrepro"
version = "0.1.0"
description = "FTQC primitives benchmark suite (Qualtran + Cirq) with QREF/Bartiq export"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"

dependencies = [
    "attrs>=25.4.0",
    "bartiq>=0.12.1",
    "cirq-core>=1.5.0",
    "click>=8.3.1",
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "pyyaml>=6.0.3",
    "qref>=0.7.0",
    "qualtran>=0.7.0",
    "scipy>=1.15.3",
]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
]

[project.scripts]
qrepro = "qrepro.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qrepro"]

[tool.pytest.ini_options]
testpaths = ["tests/"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests", "experiments", "notebooks"]

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["qrepro"]
